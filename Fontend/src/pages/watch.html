<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/watch.css">
    <link rel="stylesheet" href="../css/container.css" >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
    crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <title>Xem Phim</title>
    <script src="../services/movieService.js" defer></script>
    <script src="../logic/home/category.js" defer></script>
    <script src="../logic/watch/watch.js" defer></script>
    <script src="../utils/formatters.js" defer></script>
    <script src="../utils/watchDragScroll.js" defer></script>
    <script src="../logic/search/searchSuggest.js" defer></script>
    <script src="../logic/introduce/introducePerformer.js"></script>
    <script src="../logic/introduce/introducePerformerAnimations.js"></script>
</head>
<body>
    <div class="container">
            <div class="left-nav">
                <div class="menu-toggle" id="mobile-menu">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <a href="../pages/Home.html">
                    <img src="../image/Logo.png" alt="Logo" class="logo">
                </a>
                <ul class="menu">
                    <li class="drop-down">
                        <a href="#">Thể Loại</a>
                        <ul class="drop-down-menu" id="nav-genre-list">
                            <li><a href="#">Đang tải...</a></li>
                        </ul>
                    </li>
                    <li><a href="search.html?type=series">Phim Bộ</a></li>
                    <li><a href="search.html?type=single">Phim Chiếu Rạp</a></li>
                    <li><a href="search.html?type=anime">Phim Hoạt Hình</a></li>
                </ul>
            </div>
            <div class="right-nav">
                <form  id="search-box" class="search-box-wrapper" onsubmit="return false;" >
                <input type="text" placeholder="Tìm kiếm..." class="search-bar" id="search-text" autocomplete="off">
                <button type="button" class="search-icon" id="search-icon"><i class="fa-solid fa-magnifying-glass"></i></button>
                </input>
                </form>
                <div id="search-dropdown" class="search-dropdown"></div>
            </div>
        </div>
    <main class="watch-container">
        <!-- Khung trình chiếu linh hoạt (Video/Iframe) -->
        <div class="video-player-wrapper" id="player-container">
            <!-- JavaScript sẽ tự động chèn <video> hoặc <iframe> vào đây -->
        </div>

        <!-- Thông tin chi tiết phim -->
        <div class="movie-details">
            <hr>
            <h1 id="movie-title" class="">Đang tải tên phim...</h1>
            <div class="movie-meta">
                <span id="movie-year">----</span> | 
                <span id="movie-category">----</span>
            </div>
            <div class="episodes-wrapper">
                <hr>
                <h2>Danh Sách Tập</h2>
                <div id="episodes-container" class="episodes-container"></div>
            </div>
            <hr>
            <h2>Tóm tắt Phim</h2>
            <p id="movie-description" class="description">
                Đang tải mô tả phim...
            </p>
            <div class="cast-section">
                <hr>
                <h2>Diễn Viên</h2>
                <div id="cast-slider" class="cast-slider-container"></div>
            </div>
        </div>
    </main>
</body>
</html>
