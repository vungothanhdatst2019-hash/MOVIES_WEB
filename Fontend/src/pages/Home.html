<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" >
    <link rel="stylesheet" type="text/css" href="../css/container.css" >

          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="../services/movieService.js" defer></script>
    <script src="../logic/banner.js" defer></script>
    <script src="../logic/bannerSlide.js" defer></script>
    <script src="../logic/home_list.js" defer></script>
    <script src="../components/movieCard.js" defer></script>
    <script src="../utils/formatters.js" defer></script>    
    <script src="../utils/dragScroll.js" defer></script>
    <script src="../logic/searchSuggest.js" defer></script>
</head>

<body>
        <div class="container">
            <div class="left-nav">
                <div class="menu-toggle" id="mobile-menu">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <a href="../pages/Home.html">
                    <img src="../image/Logo.png" alt="Logo" class="logo">
                </a>
                <ul class="menu">
                    <li class="drop-down">
                        <a href="#">Thể Loại</a>
                        <ul class="drop-down-menu">
                        <li><a href="#">Hài Hước</a></li>
                        <li><a href="#">Hài Hước</a></li>
                        <li><a href="#">Hài Hước</a></li>
                        <li><a href="#">Hài Hước</a></li>
                        </ul>
                    </li>
                    <li><a href="#">Phim Lẻ</a></li>
                    <li><a href="#">Phim Chiếu Rạp</a></li>
                    <li><a href="#">Phim Hoạt Hình</a></li>
                </ul>
            </div>
            <div class="right-nav">
                <form id="search-box" class="search-box-wrapper" onsubmit="return false;">
                <input type="text" placeholder="Tìm kiếm..." class="search-bar" id="search-text" autocomplete="off">
                <button type="button" class="search-icon" id="search-icon"><i class="fa-solid fa-magnifying-glass"></i></button>
                <div id="search-dropdown" class="search-dropdown"></div>
                </form>
            </div>
        </div>
        <div class="hero-banner" id="hero-banner">
            <div class="banner-overlay"></div>
        
            <div class="banner-content">
                <h1 id="banner-title" class="banner-title">Đang tải...</h1>
            
                <!-- Badges thông tin -->
                <div class="banner-badges">
                    <span class="badge badge-year" id="banner-year">2026</span>
                </div>

                <!-- Thể loại -->
                <div class="banner-tags" id="banner-tags">
                <!-- JavaScript sẽ render tag thể loại vào đây -->
                </div>

                <!-- Tóm tắt -->
                <p class="banner-description" id="banner-description">
                Đang tải mô tả phim...
                </p>

                <!-- Nút bấm hành động -->
                <div class="banner-actions">
                    <a href="#" id="banner-play-btn" class="btn-circle btn-play" title="Xem ngay">
                        <i class="fa-solid fa-play"></i>
                    </a>
                    <a href="#" id="banner-info-btn" class="btn-circle btn-info" title="Chi tiết">
                        <i class="fa-solid fa-circle-info"></i>
                    </a>
                    </button>
                </div>
        </div>

        <!-- Danh sách Thumbnail Phim Nổi Bật ở góc dưới bên phải -->
        <div class="banner-thumbnails" id="banner-thumbnails">
            <!-- JavaScript sẽ đổ danh sách ảnh thumbnail vào đây -->
        </div>
    </div>
        <main>
            <section class="movie-section">
                <h2>PHIM MỚI ĐỀ CỬ</h2>
                <!-- Nơi JavaScript sẽ tự động đổ các div thẻ phim vào đây -->
                <div id="movie-list" class="movie-grid"></div>
            </section>
        </main>
</body>
</html>
